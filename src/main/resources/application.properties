spring.datasource.url=jdbc:h2:mem:gymdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

server.port=8080

logging.level.root=INFO
logging.level.com.epam.training=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{transactionId}] %logger{36} - %msg%n