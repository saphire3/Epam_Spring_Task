# ============================================================
# PROD profile - production environment (file-based DB, minimal logging)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/gymdb_prod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=prod
spring.datasource.password=prodpass

spring.h2.console.enabled=false

logging.level.root=ERROR
logging.level.com.epam.training=WARN

app.hibernate.ddl-auto=update
app.hibernate.show-sql=false