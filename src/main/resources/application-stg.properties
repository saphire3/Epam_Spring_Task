# ============================================================
# STG profile - staging environment (file-based DB for persistence)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/gymdb_stg;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=stg
spring.datasource.password=stgpass

spring.h2.console.enabled=false

logging.level.root=WARN
logging.level.com.epam.training=WARN

app.hibernate.ddl-auto=update
app.hibernate.show-sql=false