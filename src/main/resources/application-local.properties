# ============================================================
# LOCAL profile - developer's local machine
# ============================================================
spring.datasource.url=jdbc:h2:mem:gymdb_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.root=INFO
logging.level.com.epam.training=DEBUG
logging.level.org.hibernate.SQL=DEBUG

app.hibernate.ddl-auto=create-drop
app.hibernate.show-sql=true